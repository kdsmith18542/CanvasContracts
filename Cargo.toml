[package]
name = "canvas-contracts"
version = "0.1.0"
edition = "2021"
authors = ["Canvas Contracts Team"]
description = "Visual smart contract development platform"
license = "MIT"
repository = "https://github.com/kdsmith18542/CanvasContracts"
keywords = ["blockchain", "smart-contracts", "wasm", "visual-programming"]
categories = ["blockchain", "development-tools"]

[dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"

# Graph and data structures
petgraph = "0.6"
uuid = { version = "1.0", features = ["v4", "serde"] }

# Cryptography (used by BaaLS mock deployment)
rand = "0.8"

# Configuration
toml = "0.8"
dirs = "5.0"

# CLI
clap = { version = "4.0", features = ["derive"] }

# Async (used by BaaLS client)
async-trait = "0.1"
futures = "0.3"

# WASM runtime — uncomment when wasmtime integration is implemented
wasmtime = "15.0"

# WASM code generation
wasm-encoder = "0.38"

# Cryptographic signing — uncomment when contract signing is implemented
# sha2 = "0.10"
# ed25519-dalek = "2.0"

# JSON Schema validation — uncomment when schema validation is implemented
# jsonschema = "0.17"

# Phase 3+ module dependencies — uncomment with their feature flags
# chrono = "0.4"

[[bin]]
name = "canvas-contracts"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.8"
assert_fs = "1.1"
proptest = "1.3"
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = ["cli"]
cli = []
ai = []
debugger = []
marketplace = []
sdk = []
community = []
deployment = []
monitoring = []
optimization = []
# Enable all Phase 3+ modules (won't compile until prerequisites are met)
# all = ["ai", "debugger", "marketplace", "sdk", "community", "deployment", "monitoring", "optimization"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
