[package]
name = "canvas-contracts"
version = "0.1.0"
edition = "2021"
authors = ["Canvas Contracts Team"]
description = "Visual smart contract development platform"
license = "MIT"
repository = "https://github.com/kdsmith18542/CanvasContracts"
keywords = ["blockchain", "smart-contracts", "wasm", "visual-programming"]
categories = ["blockchain", "development-tools"]

[dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"

# Graph and data structures
petgraph = "0.6"
uuid = { version = "1.0", features = ["v4", "serde"] }

# Cryptography (used by BaaLS mock deployment)
rand = "0.8.6"

# Configuration
toml = "0.8"
dirs = "5.0"

# CLI
clap = { version = "4.0", features = ["derive"] }

# WASM runtime
wasmtime = "43.0.1"

# WASM code generation
wasm-encoder = "0.38"
wasmparser = "0.220"
wasmprinter = "0.220"

# Cryptographic signing
sha2 = "0.10"
ed25519-dalek = "2.0"
hex = "0.4"
zeroize = { version = "1.8", features = ["derive"] }

# HTTP client for BaaLS RPC
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

# Time handling (for marketplace, community modules)
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "canvas-contracts"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.8"
assert_fs = "1.1"
proptest = "1.3"
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = ["cli"]
cli = []
# Integrated modules:
# ai, marketplace, sdk, community, deployment, monitoring, optimization

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
